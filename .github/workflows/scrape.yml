name: 热搜抓取

on:
  schedule:
    # 每30分钟运行一次 (北京时间 06:00 - 次日 02:00)
    - cron: '*/30 0-17 * * *'
    - cron: '*/30 18-23 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行抓取脚本
        run: python scripts/scrape.py

      - name: 提交并推送数据
        run: |
          git config user.name "hot-trends-bot"
          git config user.email "bot@hot-trends.local"
          git add -A docs/data/
          if git diff --cached --quiet; then
            echo "无新数据，跳过提交"
          else
            git commit -m "📊 热搜快照 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
          fi
