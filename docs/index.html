<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热搜归档</title>
<style>
  :root {
    --primary: #3b63d3;
    --primary-light: #e8edfc;
    --bg: #f8f9fa;
    --card: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --border: #e2e6ef;
    --hot-red: #e74c3c;
    --hot-orange: #f39c12;
    --hot-gray: #95a5a6;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', '微软雅黑', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--primary);
    white-space: nowrap;
  }

  .search-box {
    flex: 1;
    max-width: 420px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 9px 14px 9px 38px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--bg);
    outline: none;
    transition: border-color .2s;
  }

  .search-box input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(59,99,211,0.12);
  }

  .search-box .icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    font-size: 15px;
    pointer-events: none;
  }

  .header-info {
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Left sidebar — calendar */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--card);
    border-right: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sidebar-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .cal-nav .ym {
    font-size: 15px;
    font-weight: 600;
  }

  .cal-nav button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 30px;
    height: 30px;
    cursor: pointer;
    font-size: 15px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
  }

  .cal-nav button:hover {
    background: var(--primary-light);
    color: var(--primary);
    border-color: var(--primary);
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7,1fr);
    gap: 2px;
    text-align: center;
  }

  .cal-grid .day-header {
    font-size: 11px;
    color: var(--text-secondary);
    padding: 4px 0;
    font-weight: 500;
  }

  .cal-grid .day {
    font-size: 13px;
    padding: 6px 0;
    border-radius: 6px;
    cursor: default;
    color: var(--text-secondary);
    transition: all .15s;
  }

  .cal-grid .day.has-data {
    color: var(--primary);
    font-weight: 600;
    cursor: pointer;
  }

  .cal-grid .day.has-data:hover {
    background: var(--primary-light);
  }

  .cal-grid .day.selected {
    background: var(--primary);
    color: #fff !important;
    font-weight: 600;
  }

  .cal-grid .day.empty {
    visibility: hidden;
  }

  .cal-grid .day.today {
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* Right content */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 28px;
  }

  .content-header {
    margin-bottom: 16px;
  }

  .content-header .date-title {
    font-size: 16px;
    font-weight: 600;
  }

  .content-header .date-title span {
    color: var(--text-secondary);
    font-weight: 400;
    font-size: 13px;
    margin-left: 8px;
  }

  /* Platform section */
  .platform-section {
    margin-bottom: 24px;
  }

  .platform-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--primary-light);
  }

  .platform-header .name {
    font-size: 15px;
    font-weight: 600;
  }

  .platform-header .count {
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--bg);
    padding: 1px 9px;
    border-radius: 10px;
  }

  /* Timeline */
  .timeline {
    position: relative;
    padding-left: 56px;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 19px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--border);
  }

  .time-group {
    position: relative;
    margin-bottom: 16px;
  }

  .time-dot {
    position: absolute;
    left: -38px;
    top: 5px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--primary);
    border: 2px solid var(--card);
    z-index: 1;
  }

  .time-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    margin-bottom: 6px;
  }

  .item-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .hot-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 8px;
    background: var(--bg);
    cursor: pointer;
    transition: all .15s;
    border: 1px solid transparent;
  }

  .hot-item:hover {
    background: var(--primary-light);
    border-color: rgba(59,99,211,0.2);
  }

  .hot-item.selected {
    background: var(--primary-light);
    border-color: var(--primary);
  }

  .hot-item .rank {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
    min-width: 24px;
    text-align: center;
  }

  .hot-item .rank.top3 {
    color: var(--primary);
  }

  .hot-item .title {
    flex: 1;
    font-size: 14px;
    color: var(--text);
    text-decoration: none;
    word-break: break-word;
    line-height: 1.4;
  }

  .hot-item .title:hover {
    color: var(--primary);
  }

  .hot-item .hot-value {
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .hot-value.hot-red {
    background: #fde8e8;
    color: var(--hot-red);
  }

  .hot-value.hot-orange {
    background: #fef3d5;
    color: var(--hot-orange);
  }

  .hot-value.hot-gray {
    background: #f0f0f0;
    color: var(--hot-gray);
  }

  /* Search results */
  .search-results {
    padding: 4px 0;
  }

  .search-results .sr-header {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 12px;
    color: var(--text-secondary);
  }

  .search-results .sr-header strong {
    color: var(--text);
  }

  .sr-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s;
    border-bottom: 1px solid var(--border);
  }

  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover { background: var(--primary-light); }

  .sr-item .sr-date {
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap;
    font-family: monospace;
  }

  .sr-item .sr-platform {
    font-size: 11px;
    background: var(--primary-light);
    color: var(--primary);
    padding: 1px 6px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .sr-item .sr-title {
    flex: 1;
    font-size: 13px;
  }

  .sr-item .sr-hot {
    font-size: 11px;
    font-weight: 600;
  }

  .sr-item .sr-rank {
    font-size: 11px;
    color: var(--text-secondary);
  }

  /* Trend chart */
  .trend-panel {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 20px;
    box-shadow: var(--shadow);
  }

  .trend-panel.open {
    display: block;
  }

  .trend-panel .trend-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .trend-panel .trend-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 14px;
  }

  .trend-panel .trend-close {
    float: right;
    background: none;
    border: none;
    font-size: 18px;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }

  .trend-panel .trend-close:hover { color: var(--text); }

  canvas#trendChart {
    width: 100% !important;
    height: 220px !important;
    border-radius: 6px;
  }

  .chart-container {
    position: relative;
  }

  .chart-container .no-data {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    font-size: 14px;
  }

  /* Loading & empty */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    font-size: 14px;
    gap: 8px;
  }

  .loading .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    font-size: 14px;
  }

  .empty-state .big-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }

  /* Responsive */
  @media (max-width: 768px) {
    .sidebar { width: 100%; min-width: unset; max-height: 300px; border-right: none; border-bottom: 1px solid var(--border); }
    .main { flex-direction: column; }
    .content { padding: 16px; }
    .header { flex-wrap: wrap; padding: 12px 16px; }
    .header h1 { font-size: 16px; }
    .search-box { max-width: 100%; order: 3; }
    .header-info { display: none; }
    .timeline { padding-left: 40px; }
    .hot-item { padding: 6px 10px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📊 热搜归档</h1>
  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索热搜关键词…" autocomplete="off">
  </div>
  <div class="header-info" id="headerInfo">加载中…</div>
</div>

<div class="main">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-label">📅 选择日期</div>
    <div class="cal-nav">
      <button id="prevMonth">‹</button>
      <span class="ym" id="calYM"></span>
      <button id="nextMonth">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </aside>

  <section class="content" id="content">
    <div class="content-header">
      <div class="date-title" id="dateTitle">请选择一个日期 <span>从左侧日历中选择</span></div>
    </div>
    <div id="contentBody">
      <div class="empty-state">
        <div class="big-icon">📋</div>
        <div>从左侧日历选择一个有数据的日期查看热搜</div>
      </div>
    </div>

    <!-- Trend panel -->
    <div class="trend-panel" id="trendPanel">
      <button class="trend-close" id="trendClose">✕</button>
      <div class="trend-title" id="trendTitle">热度趋势</div>
      <div class="trend-sub" id="trendSub"></div>
      <div class="chart-container">
        <canvas id="trendChart"></canvas>
      </div>
    </div>
  </section>
</div>

<script>
// ====== State ======
const state = {
  index: null,
  currentDate: null,
  currentYear: 0,
  currentMonth: 0,
  selectedKeyword: null,
  searchQuery: '',
  trendData: [],
};

// ====== Util ======
function fmtNum(n) {
  if (n === null || n === undefined) return '—';
  if (typeof n === 'string') { const v = parseFloat(n); return isNaN(v) ? n : fmtNum(v); }
  if (n >= 100000000) return (n / 100000000).toFixed(1) + '亿';
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  return String(Math.round(n));
}

function hotClass(val) {
  const v = typeof val === 'string' ? parseFloat(val) : val;
  if (isNaN(v)) return 'hot-gray';
  if (v >= 1000000) return 'hot-red';
  if (v >= 500000) return 'hot-orange';
  return 'hot-gray';
}

function hotLabel(val) {
  const v = typeof val === 'string' ? parseFloat(val) : val;
  if (isNaN(v)) return '—';
  if (v >= 1000000) return '爆';
  if (v >= 500000) return '热';
  return '';
}

function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ====== Fetch helpers ======
async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ====== Index loading ======
async function loadIndex() {
  try {
    state.index = await fetchJSON('./data/index.json');
    document.getElementById('headerInfo').textContent =
      '共 ' + Object.keys(state.index.dates).length + ' 天数据';
    const dates = Object.keys(state.index.dates).sort();
    if (dates.length > 0) {
      const last = dates[dates.length - 1];
      const ymd = last.split('-');
      state.currentYear = parseInt(ymd[0]);
      state.currentMonth = parseInt(ymd[1]);
    } else {
      const d = new Date();
      state.currentYear = d.getFullYear();
      state.currentMonth = d.getMonth() + 1;
    }
    renderCalendar();
    // Auto-select latest date
    if (dates.length > 0) {
      selectDate(dates[dates.length - 1]);
    }
  } catch (e) {
    console.error(e);
    document.getElementById('headerInfo').textContent = '❌ 加载数据失败';
    document.getElementById('contentBody').innerHTML =
      '<div class="empty-state"><div class="big-icon">⚠️</div><div>无法加载数据，请确保 data/index.json 存在</div></div>';
  }
}

// ====== Calendar ======
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

function renderCalendar() {
  const { currentYear: y, currentMonth: m } = state;
  document.getElementById('calYM').textContent = `${y} 年 ${String(m).padStart(2,'0')} 月`;

  const datesMap = state.index ? (state.index.dates || {}) : {};
  const hasDate = {};
  for (const d of Object.keys(datesMap)) {
    hasDate[d] = true;
  }

  const firstDay = new Date(y, m - 1, 1).getDay(); // 0=Sun
  const total = daysInMonth(y, m);
  const todayStr = new Date().toISOString().slice(0,10);

  let html = '';
  const headers = ['日','一','二','三','四','五','六'];
  for (const h of headers) {
    html += `<div class="day-header">${h}</div>`;
  }
  for (let i = 0; i < firstDay; i++) {
    html += '<div class="day empty"></div>';
  }
  for (let d = 1; d <= total; d++) {
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has = !!hasDate[ds];
    const cls = ['day'];
    if (has) cls.push('has-data');
    if (ds === state.currentDate) cls.push('selected');
    if (ds === todayStr) cls.push('today');
    html += `<div class="${cls.join(' ')}" data-date="${ds}">${d}</div>`;
  }
  document.getElementById('calGrid').innerHTML = html;

  // Click handlers
  document.querySelectorAll('.day.has-data').forEach(el => {
    el.addEventListener('click', () => selectDate(el.dataset.date));
  });
}

document.getElementById('prevMonth').addEventListener('click', () => {
  state.currentMonth--;
  if (state.currentMonth < 1) { state.currentMonth = 12; state.currentYear--; }
  renderCalendar();
});

document.getElementById('nextMonth').addEventListener('click', () => {
  state.currentMonth++;
  if (state.currentMonth > 12) { state.currentMonth = 1; state.currentYear++; }
  renderCalendar();
});

// ====== Date selection ======
async function selectDate(dateStr) {
  state.currentDate = dateStr;
  state.selectedKeyword = null;
  document.getElementById('trendPanel').classList.remove('open');
  renderCalendar();

  const d = new Date(dateStr + 'T00:00:00');
  const weekdays = ['日','一','二','三','四','五','六'];
  document.getElementById('dateTitle').innerHTML =
    `${dateStr} <span>星期${weekdays[d.getDay()]}</span>`;

  const body = document.getElementById('contentBody');
  body.innerHTML = '<div class="loading"><div class="spinner"></div>正在加载热点数据…</div>';

  try {
    const dateInfo = state.index.dates[dateStr];
    if (!dateInfo) {
      body.innerHTML = '<div class="empty-state"><div class="big-icon">📭</div><div>此日期暂无数据</div></div>';
      return;
    }

    const platforms = dateInfo.platforms || {};
    const platformNames = Object.keys(platforms).sort();

    let allHTML = '';
    for (const plat of platformNames) {
      const times = platforms[plat];
      const sectionHTML = await renderPlatform(dateStr, plat, times);
      allHTML += sectionHTML;
    }

    if (!allHTML) {
      body.innerHTML = '<div class="empty-state"><div class="big-icon">📭</div><div>此日期暂无数据</div></div>';
      return;
    }

    body.innerHTML = allHTML;

    // Attach item click handlers for trending
    document.querySelectorAll('.hot-item').forEach(el => {
      el.addEventListener('click', function() {
        document.querySelectorAll('.hot-item.selected').forEach(x => x.classList.remove('selected'));
        this.classList.add('selected');
        const keyword = this.dataset.keyword;
        if (keyword) showTrend(keyword);
      });
    });
  } catch (e) {
    console.error(e);
    body.innerHTML = '<div class="empty-state"><div class="big-icon">⚠️</div><div>加载失败</div></div>';
  }
}

async function renderPlatform(dateStr, platform, times) {
  const plats = state.index.dates[dateStr].platforms;
  const snapCount = times.length;

  let itemsHTML = '';
  for (const time of times) {
    const url = `./data/${platform}/${dateStr}/${time}.json`;
    let data;
    try {
      data = await fetchJSON(url);
    } catch {
      continue;
    }
    if (!data || !data.items || !data.items.length) continue;

    const items = data.items.sort((a, b) => (a.rank || 999) - (b.rank || 999));
    let listHTML = '';
    for (const item of items) {
      const hc = hotClass(item.hot_value);
      const hl = hotLabel(item.hot_value);
      const rankCls = item.rank && item.rank <= 3 ? 'top3' : '';
      listHTML += `
        <div class="hot-item" data-keyword="${escHtml(item.title)}" data-hot="${item.hot_value ?? ''}">
          <span class="rank ${rankCls}">${item.rank ?? '—'}</span>
          <a class="title" href="${escHtml(item.link || '#')}" target="_blank" rel="noopener">${escHtml(item.title)}</a>
          <span class="hot-value ${hc}">${fmtNum(item.hot_value)}${hl ? ' · ' + hl : ''}</span>
        </div>
      `;
    }

    if (listHTML) {
      itemsHTML += `
        <div class="time-group">
          <div class="time-dot"></div>
          <div class="time-label">${time.slice(0,2)}:${time.slice(2)}</div>
          <div class="item-list">${listHTML}</div>
        </div>
      `;
    }
  }

  if (!itemsHTML) return '';

  const platformLabel = platform;
  return `
    <div class="platform-section" data-platform="${escHtml(platform)}">
      <div class="platform-header">
        <span class="name">📱 ${escHtml(platformLabel)}</span>
        <span class="count">${snapCount} 个快照</span>
      </div>
      <div class="timeline">${itemsHTML}</div>
    </div>
  `;
}

// ====== Trend chart ======
async function showTrend(keyword) {
  state.selectedKeyword = keyword;
  const panel = document.getElementById('trendPanel');
  panel.classList.add('open');
  document.getElementById('trendTitle').textContent = `📈 热度趋势`;
  document.getElementById('trendSub').textContent = `「${keyword}」在 ${state.currentDate} 的快照热度值`;

  const canvas = document.getElementById('trendChart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 220 * dpr;
  canvas.style.height = '220px';
  ctx.scale(dpr, dpr);

  const W = rect.width;
  const H = 220;

  ctx.clearRect(0, 0, W, H);

  const dateInfo = state.index.dates[state.currentDate];
  if (!dateInfo) return;

  const points = [];

  for (const [plat, times] of Object.entries(dateInfo.platforms || {})) {
    for (const time of times) {
      try {
        const data = await fetchJSON(`./data/${plat}/${state.currentDate}/${time}.json`);
        if (!data || !data.items) continue;
        for (const item of data.items) {
          if (item.title === keyword && item.hot_value != null && item.hot_value !== '') {
            const val = typeof item.hot_value === 'string' ? parseFloat(item.hot_value) : item.hot_value;
            if (!isNaN(val)) {
              points.push({ time: time, value: val, platform: data.platform_name || plat });
            }
          }
        }
      } catch {}
    }
  }

  points.sort((a,b) => a.time.localeCompare(b.time));

  if (points.length === 0) {
    ctx.fillStyle = '#6b7280';
    ctx.font = '14px -apple-system, "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('无热度数据', W/2, H/2);
    state.trendData = [];
    return;
  }

  state.trendData = points;

  const pad = { top: 16, bottom: 28, left: 50, right: 16 };
  const chartW = W - pad.left - pad.right;
  const chartH = H - pad.top - pad.bottom;

  const values = points.map(p => p.value);
  const maxVal = Math.max(...values);
  const minVal = Math.min(...values);
  const range = maxVal - minVal || 1;

  // Grid lines
  ctx.strokeStyle = '#e2e6ef';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (chartH * i) / 4;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(W - pad.right, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Y-axis labels
  ctx.fillStyle = '#6b7280';
  ctx.font = '11px -apple-system, "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const val = maxVal - (range * i) / 4;
    const y = pad.top + (chartH * i) / 4;
    ctx.fillText(fmtNum(val), pad.left - 8, y);
  }

  // X-axis labels
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const labels = points.map(p => p.time.slice(0,2) + ':' + p.time.slice(2));
  // Only show some labels if too many
  const maxLabels = 8;
  const step = Math.max(1, Math.floor(labels.length / maxLabels));
  for (let i = 0; i < labels.length; i += step) {
    const x = pad.left + (i / (points.length - 1 || 1)) * chartW;
    ctx.fillText(labels[i], x, H - pad.bottom + 6);
  }
  // Always show last
  if (points.length > 1 && (points.length - 1) % step !== 0) {
    const x = pad.left + chartW;
    ctx.fillText(labels[labels.length - 1], x, H - pad.bottom + 6);
  }

  // Draw line
  ctx.beginPath();
  ctx.strokeStyle = '#3b63d3';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  for (let i = 0; i < points.length; i++) {
    const x = pad.left + (i / (points.length - 1 || 1)) * chartW;
    const y = pad.top + chartH - ((points[i].value - minVal) / range) * chartH;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Gradient fill
  ctx.beginPath();
  for (let i = 0; i < points.length; i++) {
    const x = pad.left + (i / (points.length - 1 || 1)) * chartW;
    const y = pad.top + chartH - ((points[i].value - minVal) / range) * chartH;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.lineTo(pad.left + chartW, pad.top + chartH);
  ctx.lineTo(pad.left, pad.top + chartH);
  ctx.closePath();

  const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + chartH);
  grad.addColorStop(0, 'rgba(59,99,211,0.25)');
  grad.addColorStop(1, 'rgba(59,99,211,0.02)');
  ctx.fillStyle = grad;
  ctx.fill();

  // Draw dots
  for (let i = 0; i < points.length; i++) {
    const x = pad.left + (i / (points.length - 1 || 1)) * chartW;
    const y = pad.top + chartH - ((points[i].value - minVal) / range) * chartH;
    ctx.beginPath();
    ctx.arc(x, y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#3b63d3';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

document.getElementById('trendClose').addEventListener('click', () => {
  document.getElementById('trendPanel').classList.remove('open');
  document.querySelectorAll('.hot-item.selected').forEach(x => x.classList.remove('selected'));
  state.selectedKeyword = null;
});

// ====== Search ======
let searchTimer = null;
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(this.value.trim()), 300);
});

async function doSearch(query) {
  state.searchQuery = query;
  if (!query) {
    if (state.currentDate) {
      selectDate(state.currentDate);
    } else {
      document.getElementById('contentBody').innerHTML =
        '<div class="empty-state"><div class="big-icon">🔍</div><div>输入关键词搜索…</div></div>';
    }
    return;
  }

  const body = document.getElementById('contentBody');
  body.innerHTML = '<div class="loading"><div class="spinner"></div>搜索中…</div>';

  try {
    const results = [];
    const dates = Object.keys(state.index.dates || {}).sort();

    // Limit search scope for performance
    const searchDates = dates.slice(-30); // last 30 days

    for (const dateStr of searchDates) {
      const dateInfo = state.index.dates[dateStr];
      if (!dateInfo) continue;
      for (const [plat, times] of Object.entries(dateInfo.platforms || {})) {
        for (const time of times) {
          try {
            const data = await fetchJSON(`./data/${plat}/${dateStr}/${time}.json`);
            if (!data || !data.items) continue;
            for (const item of data.items) {
              if (item.title.toLowerCase().includes(query.toLowerCase())) {
                results.push({
                  date: dateStr,
                  platform: data.platform_name || plat,
                  platKey: plat,
                  time: time,
                  title: item.title,
                  hot: item.hot_value,
                  rank: item.rank,
                  link: item.link,
                });
              }
            }
          } catch {}
        }
      }
    }

    if (results.length === 0) {
      body.innerHTML = '<div class="empty-state"><div class="big-icon">🔍</div><div>未找到匹配「' + escHtml(query) + '」的结果</div></div>';
      return;
    }

    // Sort by date desc, then time
    results.sort((a,b) => {
      if (a.date !== b.date) return b.date.localeCompare(a.date);
      return b.time.localeCompare(a.time);
    });

    // Deduplicate by title+date
    const seen = new Set();
    const unique = [];
    for (const r of results) {
      const key = r.title + '|' + r.date;
      if (!seen.has(key)) { seen.add(key); unique.push(r); }
    }

    let html = `<div class="search-results">
      <div class="sr-header">搜索 "<strong>${escHtml(query)}</strong>" — 找到 ${unique.length} 条结果</div>`;

    for (const r of unique) {
      const hc = hotClass(r.hot);
      html += `
        <div class="sr-item" data-title="${escHtml(r.title)}" data-date="${escHtml(r.date)}">
          <span class="sr-date">${r.date}</span>
          <span class="sr-platform">${escHtml(r.platform)}</span>
          <span class="sr-rank">#${r.rank ?? '—'}</span>
          <span class="sr-title"><a href="${escHtml(r.link || '#')}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;">${escHtml(r.title)}</a></span>
          <span class="sr-hot ${hc}">${fmtNum(r.hot)}</span>
        </div>
      `;
    }
    html += '</div>';
    body.innerHTML = html;

    // Click on search result -> jump to that date and show trend
    document.querySelectorAll('.sr-item').forEach(el => {
      el.addEventListener('click', function() {
        const title = this.dataset.title;
        const date = this.dataset.date;
        if (date && title) {
          state.searchQuery = '';
          document.getElementById('searchInput').value = '';
          selectDate(date).then(() => {
            // Find and click matching item
            const items = document.querySelectorAll('.hot-item');
            for (const item of items) {
              if (item.dataset.keyword === title) {
                item.click();
                item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                break;
              }
            }
          });
        }
      });
    });
  } catch (e) {
    console.error(e);
    body.innerHTML = '<div class="empty-state"><div class="big-icon">⚠️</div><div>搜索出错</div></div>';
  }
}

// ====== Init ======
loadIndex();
</script>
</body>
