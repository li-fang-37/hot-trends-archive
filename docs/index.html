<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>热搜档案</title>
<style>
:root {
  --primary: #3b63d3;
  --primary-light: #e8edfc;
  --primary-bg: rgba(59,99,211,0.06);
  --bg: #f0f2f5;
  --card: #ffffff;
  --text: #1a1a2e;
  --text2: #6b7280;
  --text3: #9ca3af;
  --border: #e5e7eb;
  --radius: 10px;
  --shadow: 0 1px 4px rgba(0,0,0,0.05);
  --red: #ef4444;
  --orange: #f59e0b;
  --gray: #9ca3af;
  --p-weibo: #d63031;
  --p-zhihu: #3b63d3;
  --p-baidu: #e67e22;
  --p-douyin: #00b894;
  --p-bili: #e84393;
  --p-toutiao: #636e72;
  --header-h: 52px;
  --bar-h: 42px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','微软雅黑','PingFang SC','Noto Sans CJK SC',sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
/* scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--text3);border-radius:4px}

/* ===== Header ===== */
.header{
  position:sticky;top:0;z-index:200;
  background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
  padding:0 14px;height:var(--header-h);
}
.header h1{font-size:16px;font-weight:700;color:var(--primary);white-space:nowrap;letter-spacing:.5px}
.header .search-wrap{flex:1;position:relative;max-width:320px}
.header .search-wrap input{
  width:100%;height:32px;padding:0 10px 0 30px;
  border:1px solid var(--border);border-radius:8px;font-size:13px;
  background:var(--bg);outline:none;transition:border-color .2s;
}
.header .search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,99,211,0.1)}
.header .search-wrap .s-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.header .info{font-size:12px;color:var(--text2);white-space:nowrap}

/* ===== Scroll bars container ===== */
.bars-wrap{
  position:sticky;top:var(--header-h);z-index:150;
  background:var(--card);border-bottom:1px solid var(--border);
  padding:0;
}
.bar-row{
  display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;gap:0;
  padding:0 10px;height:var(--bar-h);
}
.bar-row::-webkit-scrollbar{display:none}
.bar-row .label{
  font-size:11px;color:var(--text3);white-space:nowrap;margin-right:6px;flex-shrink:0;
}
.pill{
  flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  height:28px;padding:0 12px;margin:0 3px;
  border-radius:14px;font-size:12px;font-weight:500;cursor:pointer;
  border:1px solid var(--border);background:var(--bg);color:var(--text2);
  transition:all .15s;white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent;
}
.pill.active,.pill:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.pill.p-active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pill.p-inactive{border-color:var(--border);opacity:.7}

/* ===== Main layout ===== */
.layout{display:flex;flex:1;overflow:hidden}

/* ===== Calendar sidebar ===== */
.cal-sidebar{
  width:140px;min-width:140px;background:var(--card);
  border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;
  padding:10px 8px;display:flex;flex-direction:column;
}
.cal-sidebar .cal-title{
  font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;text-align:center;
}
.cal-nav{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;
}
.cal-nav .ym{font-size:13px;font-weight:600}
.cal-nav button{
  background:none;border:1px solid var(--border);border-radius:5px;
  width:24px;height:24px;cursor:pointer;font-size:13px;color:var(--text3);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;line-height:1;
}
.cal-nav button:hover{background:var(--primary-light);color:var(--primary);border-color:var(--primary)}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;
}
.cal-grid .dh{font-size:10px;color:var(--text3);padding:2px 0;font-weight:500}
.cal-grid .day{
  font-size:12px;padding:4px 0;border-radius:4px;cursor:default;color:var(--text3);
  transition:all .12s;line-height:1.4;
}
.cal-grid .day.has{color:var(--primary);font-weight:600;cursor:pointer}
.cal-grid .day.has:hover{background:var(--primary-light)}
.cal-grid .day.sel{background:var(--primary);color:#fff!important;font-weight:600}
.cal-grid .day.empty{visibility:hidden}
.cal-grid .day.tdy{text-decoration:underline;text-underline-offset:2px}

/* ===== Content area ===== */
.content{flex:1;overflow-y:auto;padding:12px 12px 80px;-webkit-overflow-scrolling:touch}

/* Loading / empty */
.loading,.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text3);font-size:14px;gap:10px}
.loading .spinner{width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state .big-icon{font-size:36px;opacity:.4}

/* ===== Platform card ===== */
.plat-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  margin-bottom:12px;overflow:hidden;
}
.plat-card .pc-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--border);
}
.plat-card .pc-header .pc-name{
  font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;
}
.plat-card .pc-header .pc-name .dot{
  width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;
}
.plat-card .pc-header .pc-time{font-size:11px;color:var(--text3)}
.plat-card .pc-body{padding:0}
.plat-card .pc-footer{
  padding:8px 14px;border-top:1px solid var(--border);
  text-align:center;
}
.plat-card .pc-footer button{
  background:none;border:none;color:var(--primary);font-size:13px;font-weight:500;
  cursor:pointer;padding:4px 12px;border-radius:6px;transition:background .15s;
  -webkit-tap-highlight-color:transparent;
}
.plat-card .pc-footer button:hover{background:var(--primary-bg)}
.plat-card .pc-footer button:active{background:var(--primary-light)}

/* ===== Hot item ===== */
.hot-item{
  display:flex;align-items:center;gap:8px;padding:7px 14px;
  cursor:pointer;transition:background .12s;border-bottom:1px solid var(--border);
  -webkit-tap-highlight-color:transparent;
}
.hot-item:last-child{border-bottom:none}
.hot-item:hover{background:var(--primary-bg)}
.hot-item .r-rank{
  font-size:12px;font-weight:700;color:var(--text3);min-width:20px;text-align:center;flex-shrink:0;
}
.hot-item .r-rank.top3{color:var(--primary)}
.hot-item .r-rank.r1{color:var(--red)}
.hot-item .r-body{flex:1;min-width:0}
.hot-item .r-title{
  font-size:13px;font-weight:500;color:var(--text);text-decoration:none;
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hot-item .r-title:active{color:var(--primary)}
.hot-item .r-bar-wrap{margin-top:3px;display:flex;align-items:center;gap:6px}
.hot-item .r-bar{
  height:4px;border-radius:2px;flex:1;background:var(--bg);overflow:hidden;
}
.hot-item .r-bar-inner{height:100%;border-radius:2px;transition:width .3s ease}
.hot-item .r-val{font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0}

.hot-item .r-change{
  font-size:11px;white-space:nowrap;flex-shrink:0;min-width:30px;text-align:right;
}
.hot-item .r-change.new{color:var(--red);font-weight:600}
.hot-item .r-change.up{color:var(--orange)}
.hot-item .r-change.down{color:var(--text3)}

/* ===== Search results ===== */
.sr-list{display:flex;flex-direction:column;gap:4px}
.sr-item{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:var(--card);border-radius:8px;box-shadow:var(--shadow);cursor:pointer;
  transition:background .12s;-webkit-tap-highlight-color:transparent;
}
.sr-item:hover{background:var(--primary-bg)}
.sr-item .sr-platform{font-size:11px;padding:1px 6px;border-radius:4px;color:#fff;white-space:nowrap;flex-shrink:0}
.sr-item .sr-title{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-item .sr-date{font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0}
.sr-item .sr-hot{font-size:11px;color:var(--text2);white-space:nowrap;flex-shrink:0}
.sr-header{font-size:14px;color:var(--text2);margin-bottom:10px}
.sr-header strong{color:var(--text)}

/* ===== Responsive ===== */
@media(max-width:768px){
  .cal-sidebar{width:100%;min-width:unset;max-height:200px;border-right:none;border-bottom:1px solid var(--border)}
  .layout{flex-direction:column}
  .header{padding:0 10px;height:48px}
  .header h1{font-size:14px}
  .header .search-wrap{max-width:none}
  .header .info{display:none}
  .content{padding:10px 10px 70px}
  :root{--header-h:48px;--bar-h:38px}
  .bar-row{padding:0 8px;height:var(--bar-h)}
  .pill{height:26px;padding:0 10px;font-size:11px}
  .plat-card .pc-header{padding:8px 12px}
  .hot-item{padding:6px 12px}
  .plat-card .pc-footer{padding:6px 12px}
  .plat-card .pc-footer button{font-size:12px}
}
</style>
</head>
<body>

<div class="header">
  <h1>🔥 热搜档案</h1>
  <div class="search-wrap">
    <span class="s-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索关键词…" autocomplete="off">
  </div>
  <span class="info" id="headerInfo">加载中…</span>
</div>

<div class="bars-wrap">
  <div class="bar-row" id="timeBar">
    <span class="label">⏱</span>
    <span class="pill active" data-time="">全部时段</span>
  </div>
  <div class="bar-row" id="platBar">
    <span class="label">📱</span>
    <span class="pill active" data-platform="">全部平台</span>
    <span class="pill" data-platform="weibo" style="--p:var(--p-weibo)">微博</span>
    <span class="pill" data-platform="zhihu" style="--p:var(--p-zhihu)">知乎</span>
    <span class="pill" data-platform="baidu" style="--p:var(--p-baidu)">百度</span>
    <span class="pill" data-platform="douyin" style="--p:var(--p-douyin)">抖音</span>
    <span class="pill" data-platform="bili" style="--p:var(--p-bili)">B站</span>
    <span class="pill" data-platform="toutiao" style="--p:var(--p-toutiao)">头条</span>
  </div>
</div>

<div class="layout">
  <aside class="cal-sidebar" id="calSidebar">
    <div class="cal-title">📅 日期</div>
    <div class="cal-nav">
      <button id="prevMonth">‹</button>
      <span class="ym" id="calYM"></span>
      <button id="nextMonth">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </aside>

  <main class="content" id="content">
    <div class="empty-state">
      <div class="big-icon">📋</div>
      <div>从左侧日历选择日期</div>
    </div>
  </main>
</div>

<script>
// ====== Constants ======
const PLAT_META = {
  weibo:{label:'微博',color:'#d63031'},
  zhihu:{label:'知乎',color:'#3b63d3'},
  baidu:{label:'百度',color:'#e67e22'},
  douyin:{label:'抖音',color:'#00b894'},
  bili:{label:'B站',color:'#e84393'},
  toutiao:{label:'头条',color:'#636e72'},
};
const PLAT_KEYS = Object.keys(PLAT_META);

// ====== State ======
const S = {
  index: null,               // index.json data
  curDate: null,             // selected date string
  curYear: 0,                // calendar year
  curMonth: 0,               // calendar month
  selTime: '',               // selected time pill value
  selPlat: '',               // selected platform pill value
  searchQ: '',               // search query
  // Cached data: { 'date:platform:time': dataObj }
  cache: {},
  // For current view: { time: [...items], prevTime: [...items] } per platform
};

// ====== Utils ======
function numFmt(n){
  if(n==null)return'—';
  if(typeof n==='string'){const v=parseFloat(n);return isNaN(v)?n:numFmt(v)}
  if(n>=1e8)return(n/1e8).toFixed(1)+'亿';
  if(n>=1e4)return(n/1e4).toFixed(1)+'万';
  return String(Math.round(n));
}
function barColor(v){
  const n=typeof v==='string'?parseFloat(v):v;
  if(isNaN(n))return'var(--gray)';
  if(n>=1000000)return'var(--red)';
  if(n>=500000)return'var(--orange)';
  return'var(--primary)';
}
function hotTag(v){
  const n=typeof v==='string'?parseFloat(v):v;
  if(isNaN(n))return'';
  if(n>=1000000)return'爆';
  if(n>=500000)return'热';
  return'';
}
function esc(s){
  const d=document.createElement('div');d.textContent=s;return d.innerHTML;
}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}

// ====== Fetch with cache ======
async function loadData(platform,date,time){
  const key=`${date}:${platform}:${time}`;
  if(S.cache[key])return S.cache[key];
  const url=`./data/${platform}/${date}/${time}.json`;
  try{
    const res=await fetch(url);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    S.cache[key]=data;
    return data;
  }catch(e){
    console.warn('Load fail:',url,e);
    return null;
  }
}

// ====== Index ======
async function loadIndex(){
  try{
    S.index=await fetch('./data/index.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
    const dates=Object.keys(S.index.dates).sort();
    document.getElementById('headerInfo').textContent=dates.length+' 天';
    if(dates.length){
      const last=dates[dates.length-1];
      const [y,m]=last.split('-').map(Number);
      S.curYear=y;S.curMonth=m;
    }else{
      const d=new Date();S.curYear=d.getFullYear();S.curMonth=d.getMonth()+1;
    }
    renderCal();
    if(dates.length)selectDate(dates[dates.length-1]);
  }catch(e){
    console.error(e);
    document.getElementById('headerInfo').textContent='❌ 加载失败';
    document.getElementById('content').innerHTML=
      '<div class="empty-state"><div class="big-icon">⚠️</div><div>无法加载 data/index.json</div></div>';
  }
}

// ====== Calendar ======
function daysInMonth(y,m){return new Date(y,m,0).getDate()}

function renderCal(){
  const {curYear:y,curMonth:m}=S;
  document.getElementById('calYM').textContent=`${y}年${String(m).padStart(2,'0')}月`;
  const datesMap=S.index?S.index.dates:{};
  const hasDate={};
  for(const d of Object.keys(datesMap))hasDate[d]=true;
  const firstDay=new Date(y,m-1,1).getDay();
  const total=daysInMonth(y,m);
  const today=new Date().toISOString().slice(0,10);
  let html='';
  for(const h of['日','一','二','三','四','五','六'])html+=`<div class="dh">${h}</div>`;
  for(let i=0;i<firstDay;i++)html+='<div class="day empty"></div>';
  for(let d=1;d<=total;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=!!hasDate[ds];
    const cls=['day'];
    if(has)cls.push('has');
    if(ds===S.curDate)cls.push('sel');
    if(ds===today)cls.push('tdy');
    html+=`<div class="${cls.join(' ')}" data-date="${ds}">${d}</div>`;
  }
  document.getElementById('calGrid').innerHTML=html;
  document.querySelectorAll('.day.has').forEach(el=>{
    el.addEventListener('click',()=>selectDate(el.dataset.date));
  });
}

document.getElementById('prevMonth').addEventListener('click',()=>{
  S.curMonth--;if(S.curMonth<1){S.curMonth=12;S.curYear--}renderCal();
});
document.getElementById('nextMonth').addEventListener('click',()=>{
  S.curMonth++;if(S.curMonth>12){S.curMonth=1;S.curYear++}renderCal();
});

// ====== Date selection ======
async function selectDate(dateStr){
  S.curDate=dateStr;
  // Reset time/platform selection
  S.selTime='';
  S.selPlat='';
  renderCal();
  renderTimeBar();
  renderPlatBar();
  await renderView();
}

// ====== Render time bar ======
function renderTimeBar(){
  const bar=document.getElementById('timeBar');
  let html='<span class="label">⏱</span>';
  html+=`<span class="pill ${S.selTime===''?'active':''}" data-time="">全部时段</span>`;
  if(S.curDate&&S.index){
    const dateInfo=S.index.dates[S.curDate];
    if(dateInfo){
      // Collect all unique times across platforms
      const timeSet=new Set();
      for(const plat of PLAT_KEYS){
        const times=dateInfo.platforms[plat];
        if(times)times.forEach(t=>timeSet.add(t));
      }
      const sorted=Array.from(timeSet).sort();
      for(const t of sorted){
        const active=S.selTime===t?'active':'';
        html+=`<span class="pill ${active}" data-time="${t}">${t.slice(0,2)}:${t.slice(2)}</span>`;
      }
    }
  }
  bar.innerHTML=html;
  bar.querySelectorAll('.pill[data-time]').forEach(el=>{
    el.addEventListener('click',()=>{
      S.selTime=el.dataset.time;
      renderTimeBar();
      renderView();
    });
  });
}

// ====== Render platform bar ======
function renderPlatBar(){
  const bar=document.getElementById('platBar');
  // Keep the static label + all/individual items, just update active
  bar.querySelectorAll('.pill').forEach(el=>{
    const p=el.dataset.platform;
    if(p===undefined)return;
    if(p===''){
      el.classList.toggle('active',S.selPlat==='');
    }else{
      el.classList.toggle('active',S.selPlat===p);
    }
  });
}

// ====== Main render ======
function getTimeLabel(t){return t.slice(0,2)+':'+t.slice(2)}

function getTimesForDate(dateStr){
  const di=S.index.dates[dateStr];
  if(!di)return[];
  const timeSet=new Set();
  for(const plat of PLAT_KEYS){
    const times=di.platforms[plat];
    if(times)times.forEach(t=>timeSet.add(t));
  }
  return Array.from(timeSet).sort();
}

// Get items for a platform at a specific time on a date
async function getItems(platform,date,time){
  const data=await loadData(platform,date,time);
  if(!data||!data.items)return[];
  return data.items.map((item,i)=>({
    ...item,
    hot_value:typeof item.hot_value==='string'?parseFloat(item.hot_value)||0:(item.hot_value||0),
    rank:item.rank||(i+1),
  })).sort((a,b)=>a.rank-b.rank);
}

async function renderView(){
  const body=document.getElementById('content');
  if(!S.curDate||!S.index){
    body.innerHTML='<div class="empty-state"><div class="big-icon">📋</div><div>从左侧日历选择日期</div></div>';
    return;
  }
  const dateInfo=S.index.dates[S.curDate];
  if(!dateInfo){
    body.innerHTML='<div class="empty-state"><div class="big-icon">📭</div><div>此日期暂无数据</div></div>';
    return;
  }
  body.innerHTML='<div class="loading"><div class="spinner"></div>加载中…</div>';

  const allTimes=getTimesForDate(S.curDate);
  const selTime=S.selTime||(allTimes.length?allTimes[allTimes.length-1]:'');
  const timesToRender=S.selTime?[S.selTime]:[selTime];
  const showAll=S.selTime==='';

  let targetTimes;
  if(showAll){
    // Get the last time for each platform
    targetTimes=timesToRender;
  }else{
    targetTimes=timesToRender;
  }

  // Determine which platforms to render
  let platsToRender;
  if(S.selPlat){
    platsToRender=[S.selPlat];
  }else{
    platsToRender=PLAT_KEYS.filter(p=>dateInfo.platforms[p]&&dateInfo.platforms[p].length>0);
  }

  // For each platform, find the latest available time (or use selected time)
  async function getTargetTime(plat){
    const times=dateInfo.platforms[plat]||[];
    if(!times.length)return null;
    if(S.selTime){
      return times.includes(S.selTime)?S.selTime:null;
    }
    // Latest time for this platform
    return times[times.length-1];
  }

  // Get previous time for comparison
  function getPrevTime(plat,curTime){
    const times=dateInfo.platforms[plat]||[];
    const idx=times.indexOf(curTime);
    return idx>0?times[idx-1]:null;
  }

  // Build cards
  let html='';

  for(const plat of platsToRender){
    const targetTime=await getTargetTime(plat);
    if(!targetTime)continue;
    const prevTime=getPrevTime(plat,targetTime);

    // Load data
    const [curItems,prevItems]=await Promise.all([
      getItems(plat,S.curDate,targetTime),
      prevTime?getItems(plat,S.curDate,prevTime):Promise.resolve([]),
    ]);

    if(!curItems.length&&!showAll)continue;
    if(!curItems.length)continue;

    // Build comparison map
    const prevMap={};
    for(const item of prevItems){
      prevMap[item.title]=item;
    }

    // Determine how many items to show
    const isFiltered=S.selPlat!=='';
    const maxShow=isFiltered?curItems.length:Math.min(5,curItems.length);
    const showItems=curItems.slice(0,maxShow);
    const hasMore=curItems.length>maxShow;

    const meta=PLAT_META[plat]||{label:plat,color:'#666'};

    html+=`<div class="plat-card" data-platform="${plat}">
      <div class="pc-header">
        <div class="pc-name">
          <span class="dot" style="background:${meta.color}"></span>
          ${meta.label}
        </div>
        <div class="pc-time">${getTimeLabel(targetTime)}</div>
      </div>
      <div class="pc-body">`;

    for(const item of showItems){
      const prev=prevMap[item.title];
      let changeHTML='';
      let changeTag='';
      if(!prev){
        changeTag='🔴新';
        changeHTML=`<span class="r-change new">${changeTag}</span>`;
      }else{
        const diff=prev.rank-item.rank;
        if(diff>0){
          changeTag=`📈${diff}`;
          changeHTML=`<span class="r-change up">${changeTag}</span>`;
        }else if(diff<0){
          changeTag=`📉${Math.abs(diff)}`;
          changeHTML=`<span class="r-change down">${changeTag}</span>`;
        }else{
          changeTag='—';
          changeHTML=`<span class="r-change" style="color:var(--text3)">${changeTag}</span>`;
        }
      }

      const rCls=item.rank<=3?'top3':'';
      const r1Cls=item.rank===1?'r1':'';
      const hc=barColor(item.hot_value);
      const pct=curItems.length?clamp((item.hot_value/Math.max(...curItems.map(x=>x.hot_value)))*100,5,100):0;
      const tag=hotTag(item.hot_value);

      html+=`<div class="hot-item" data-title="${esc(item.title)}">
        <span class="r-rank ${rCls} ${r1Cls}">${item.rank}</span>
        <div class="r-body">
          <a class="r-title" href="${esc(item.link||'#')}" target="_blank" rel="noopener">${esc(item.title)}${tag?' · '+tag:''}</a>
          <div class="r-bar-wrap">
            <div class="r-bar"><div class="r-bar-inner" style="width:${pct}%;background:${hc}"></div></div>
            <span class="r-val">${numFmt(item.hot_value)}</span>
          </div>
        </div>
        ${changeHTML}
      </div>`;
    }

    html+=`</div>`;
    if(hasMore){
      html+=`<div class="pc-footer">
        <button data-platform="${plat}" data-expand="${targetTime}">展开全部 ${curItems.length} 条 &darr;</button>
      </div>`;
    }
    html+=`</div>`;
  }

  if(!html){
    body.innerHTML='<div class="empty-state"><div class="big-icon">📭</div><div>暂无数据</div></div>';
    return;
  }

  body.innerHTML=html;

  // Expand buttons
  body.querySelectorAll('[data-expand]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const plat=btn.dataset.platform;
      S.selPlat=plat;
      renderPlatBar();
      renderView();
    });
  });
}

// ====== Search ======
let searchTimer=null;
document.getElementById('searchInput').addEventListener('input',function(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>doSearch(this.value.trim()),300);
});

async function doSearch(q){
  S.searchQ=q;
  const body=document.getElementById('content');
  if(!q){
    if(S.curDate)renderView();
    else body.innerHTML='<div class="empty-state"><div class="big-icon">📋</div><div>从左侧日历选择日期</div></div>';
    return;
  }
  body.innerHTML='<div class="loading"><div class="spinner"></div>搜索中…</div>';
  try{
    const results=[];
    const dates=Object.keys(S.index.dates).sort().reverse();
    const limit=50;
    for(const date of dates){
      if(results.length>=limit)break;
      const di=S.index.dates[date];
      for(const plat of PLAT_KEYS){
        const times=di.platforms[plat];
        if(!times)continue;
        // Only check the latest time per platform to keep search fast
        const latest=times[times.length-1];
        const data=await loadData(plat,date,latest);
        if(!data||!data.items)continue;
        for(const item of data.items){
          if(item.title.includes(q)){
            results.push({title:item.title,date,platform:plat,time:latest,hot:item.hot_value});
            if(results.length>=limit)break;
          }
        }
        if(results.length>=limit)break;
      }
    }
    if(!results.length){
      body.innerHTML=`<div class="empty-state"><div class="big-icon">🔍</div><div>未找到「${esc(q)}」相关结果</div></div>`;
      return;
    }
    let html=`<div class="sr-header">搜索「<strong>${esc(q)}</strong>」共 ${results.length} 条结果</div><div class="sr-list">`;
    for(const r of results){
      const meta=PLAT_META[r.platform]||{label:r.platform,color:'#666'};
      html+=`<div class="sr-item" data-date="${r.date}" data-title="${esc(r.title)}">
        <span class="sr-platform" style="background:${meta.color}">${meta.label}</span>
        <span class="sr-title">${esc(r.title)}</span>
        <span class="sr-date">${r.date}</span>
        <span class="sr-hot">${numFmt(r.hot)}</span>
      </div>`;
    }
    html+='</div>';
    body.innerHTML=html;
    body.querySelectorAll('.sr-item').forEach(el=>{
      el.addEventListener('click',function(){
        const date=this.dataset.date;
        const title=this.dataset.title;
        if(date&&title){
          S.searchQ='';
          document.getElementById('searchInput').value='';
          selectDate(date).then(()=>{
            // Find matching item and scroll to it
            setTimeout(()=>{
              const items=document.querySelectorAll('.hot-item');
              for(const item of items){
                if(item.dataset.title===title){
                  item.scrollIntoView({behavior:'smooth',block:'center'});
                  item.style.background='var(--primary-light)';
                  setTimeout(()=>item.style.background='',1500);
                  break;
                }
              }
            },200);
          });
        }
      });
    });
  }catch(e){
    console.error(e);
    body.innerHTML=`<div class="empty-state"><div class="big-icon">⚠️</div><div>搜索出错</div></div>`;
  }
}

// ====== Platform bar click handlers (static) ======
document.querySelectorAll('#platBar .pill[data-platform]').forEach(el=>{
  el.addEventListener('click',()=>{
    const p=el.dataset.platform;
    S.selPlat=p||'';
    // Clear search when switching platform
    renderPlatBar();
    renderView();
  });
});

// ====== Init ======
loadIndex();
</script>
