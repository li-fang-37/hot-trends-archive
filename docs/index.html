<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>热搜档案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:#f2f3f5;color:#1f2937;font-size:14px;-webkit-font-smoothing:antialiased}
.header{background:#3b63d3;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20}
.header h1{font-size:17px;font-weight:700}
.header .sub{font-size:11px;opacity:.7;margin-top:1px}
.search-bar{display:flex;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:52px;z-index:19}
.search-bar input{flex:1;padding:7px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;outline:none;background:#f7f8fa}
.search-bar input:focus{border-color:#3b63d3;background:#fff}
.search-bar button{padding:6px 12px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;font-size:12px;cursor:pointer;color:#6b7280;display:none}
.main{display:flex;min-height:calc(100vh - 100px)}
.sidebar{width:160px;background:#fff;border-right:1px solid #e5e7eb;overflow-y:auto;flex-shrink:0}
.sidebar .cal-nav{padding:10px 6px 4px;display:flex;align-items:center;justify-content:space-between}
.sidebar .cal-nav button{background:none;border:1px solid #e5e7eb;border-radius:6px;padding:3px 6px;cursor:pointer;font-size:11px;color:#374151}
.sidebar .cal-nav .label{font-size:11px;font-weight:600}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:4px 4px 8px}
.cal-header{text-align:center;font-size:8px;color:#9ca3af;padding:2px 0}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10px;border-radius:4px;color:#d1d5db;position:relative;cursor:default}
.cal-day.has-data{color:#1f2937;cursor:pointer;font-weight:500}
.cal-day.has-data:hover{background:#eef1ff;color:#3b63d3}
.cal-day.selected{background:#3b63d3!important;color:#fff!important;font-weight:600}
.cal-day.today{outline:2px solid #3b63d3;outline-offset:-2px}
.cal-day .dot{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:#3b63d3}
.content{flex:1;overflow-y:auto;padding:10px 12px;background:#f2f3f5}

/* 时间选择条 */
.time-strip{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.time-strip::-webkit-scrollbar{display:none}
.time-pill{padding:5px 12px;border-radius:16px;font-size:12px;border:1px solid #e5e7eb;background:#fff;color:#6b7280;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.time-pill:hover{border-color:#3b63d3;color:#3b63d3}
.time-pill.active{background:#3b63d3;color:#fff;border-color:#3b63d3;font-weight:600}
.time-pill .t-count{font-size:9px;opacity:.6;margin-left:4px}

/* 平台 Tab */
.plat-strip{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.plat-strip::-webkit-scrollbar{display:none}
.plat-pill{padding:4px 10px;border-radius:12px;font-size:11px;border:1px solid #e5e7eb;background:#fff;color:#6b7280;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.plat-pill:hover{border-color:#3b63d3;color:#3b63d3}
.plat-pill.active{background:#3b63d3;color:#fff;border-color:#3b63d3}

/* 结果列表 */
.date-title{font-size:14px;font-weight:600;margin-bottom:8px;color:#374151}
.date-title .count{font-size:11px;color:#9ca3af;font-weight:400;margin-left:6px}
.items{display:grid;gap:4px}
.item{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#fff;border-radius:6px;border:1px solid #e5e7eb;font-size:13px}
.item .rank{font-size:11px;font-weight:700;color:#9ca3af;min-width:18px;text-align:center;flex-shrink:0}
.item .rank.r1{color:#ef4444}.item .rank.r2{color:#f59e0b}.item .rank.r3{color:#8b5cf6}
.item .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .title a{color:inherit;text-decoration:none}
.item .title a:hover{color:#3b63d3}
.item .tag{font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;flex-shrink:0}
.item .tag.fire{color:#ef4444;background:#fef2f2}
.item .tag.warm{color:#f59e0b;background:#fffbeb}
.item .tag.norm{color:#9ca3af;background:#f3f4f6}
.item .plat-tag{font-size:9px;padding:1px 4px;border-radius:3px;flex-shrink:0}
.plat-we{background:#fff0f0;color:#d63031}
.plat-zh{background:#eef1ff;color:#3b63d3}
.plat-bd{background:#fff8e1;color:#e67e22}
.plat-dy{background:#f0fff4;color:#00b894}
.plat-bl{background:#fff0f7;color:#e84393}
.plat-tt{background:#f0f0f0;color:#636e72}
.empty-state{text-align:center;padding:50px 20px;color:#9ca3af;font-size:13px}
.loading{text-align:center;padding:30px;color:#9ca3af;font-size:13px}
.loading .sp{display:inline-block;width:14px;height:14px;border:2px solid #e5e7eb;border-top-color:#3b63d3;border-radius:50%;animation:spin .6s linear infinite;margin-right:5px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.search-result{font-size:12px;color:#6b7280;margin-bottom:6px}
@media(max-width:640px){.sidebar{width:130px}.content{padding:8px}}
</style>
</head>
<body>
<div class="header"><h1>🔥 热搜档案</h1><div class="sub">←选日期 →选时段 →选平台 快速定位</div></div>
<div class="search-bar">
  <input id="searchInput" placeholder="🔍 搜关键词…" autocomplete="off">
  <button id="clearBtn">清除</button>
</div>
<div class="main">
<div class="sidebar">
  <div class="cal-nav">
    <button id="prevMonth">‹</button>
    <span class="label" id="calLabel"></span>
    <button id="nextMonth">›</button>
  </div>
  <div class="calendar" id="calendar"></div>
</div>
<div class="content" id="content">
  <div class="empty-state">📊 从左侧选择日期</div>
</div>
</div>
<script>
const STATE={dates:{},currentDate:'',allSlots:[],selectedTime:'all',selectedPlat:'all',searchQuery:''};
const NAMES={weibo:'微博',zhihu:'知乎',baidu:'百度',douyin:'抖音',bili:'B站',toutiao:'头条'};
const PLAT_CLS={weibo:'plat-we',zhihu:'plat-zh',baidu:'plat-bd',douyin:'plat-dy',bili:'plat-bl',toutiao:'plat-tt'};
async function loadJSON(u){const r=await fetch(u);if(!r.ok)throw Error();return r.json()}

async function init(){
  try{
    const idx=await loadJSON('./data/index.json');
    STATE.dates=idx.dates||{};
    renderCalendar();
    const ds=Object.keys(STATE.dates).sort();
    if(ds.length)selectDate(ds[ds.length-1]);
    else document.getElementById('content').innerHTML='<div class="empty-state">📭 暂无数据</div>';
  }catch(e){
    document.getElementById('content').innerHTML='<div class="empty-state">⚠️ 数据加载失败</div>';
  }
  const inp=document.getElementById('searchInput'),btn=document.getElementById('clearBtn');
  let timer;
  inp.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{STATE.searchQuery=inp.value.trim();btn.style.display=STATE.searchQuery?'block':'none';renderContent()},350)});
  btn.addEventListener('click',()=>{inp.value='';STATE.searchQuery='';btn.style.display='none';renderContent();inp.focus()});
  document.getElementById('prevMonth').addEventListener('click',()=>{const d=new Date(document.getElementById('calLabel').textContent.replace('年','/').replace('月','/1'));d.setMonth(d.getMonth()-1);renderCalendar(d.getFullYear(),d.getMonth()+1)});
  document.getElementById('nextMonth').addEventListener('click',()=>{const d=new Date(document.getElementById('calLabel').textContent.replace('年','/').replace('月','/1'));d.setMonth(d.getMonth()+1);renderCalendar(d.getFullYear(),d.getMonth()+1)});
}

function renderCalendar(y,m){
  const now=new Date();y=y||now.getFullYear();m=m||now.getMonth()+1;
  document.getElementById('calLabel').textContent=y+'年'+String(m).padStart(2,'0')+'月';
  const cal=document.getElementById('calendar');
  cal.innerHTML='<div class="cal-header">日</div><div class="cal-header">一</div><div class="cal-header">二</div><div class="cal-header">三</div><div class="cal-header">四</div><div class="cal-header">五</div><div class="cal-header">六</div>';
  const first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();
  const todayStr=now.toISOString().slice(0,10);
  for(let i=0;i<first;i++)cal.innerHTML+='<div></div>';
  for(let d=1;d<=days;d++){
    const ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const has=!!STATE.dates[ds],sel=ds===STATE.currentDate?'selected':'',td=ds===todayStr?'today':'';
    cal.innerHTML+='<div class="cal-day '+(has?'has-data ':'')+sel+' '+td+'" data-date="'+ds+'">'+d+(has?'<div class="dot"></div>':'')+'</div>';
  }
  document.querySelectorAll('.cal-day.has-data').forEach(el=>el.addEventListener('click',()=>selectDate(el.dataset.date)));
}

function selectDate(ds){
  STATE.currentDate=ds;
  STATE.selectedTime='all';
  STATE.selectedPlat='all';
  loadSlots(ds);
  renderCalendar(parseInt(ds.slice(0,4)),parseInt(ds.slice(5,7)));
  renderContent();
}

async function loadSlots(ds){
  STATE.allSlots=[];
  const dd=STATE.dates[ds];
  if(!dd)return;
  for(const [p,times] of Object.entries(dd.platforms||{})){
    for(const t of times){
      try{
        const data=await loadJSON('./data/'+p+'/'+ds+'/'+t+'.json');
        if(data&&data.items)STATE.allSlots.push({platform:p,time:t,items:data.items});
      }catch(e){}
    }
  }
  STATE.allSlots.sort((a,b)=>a.time.localeCompare(b.time));
}

function renderContent(){
  const area=document.getElementById('content');
  const q=STATE.searchQuery.trim();
  if(q){renderSearch(area,q);return}
  if(!STATE.currentDate){area.innerHTML='<div class="empty-state">📊 从左侧选择日期</div>';return}
  if(STATE.allSlots.length===0){area.innerHTML='<div class="empty-state">📭 暂无数据</div>';return}

  // Get unique times and platforms
  const times=[...new Set(STATE.allSlots.map(s=>s.time))].sort();
  const plats=[...new Set(STATE.allSlots.map(s=>s.platform))].sort();

  // Filter by selected time + platform
  let filtered=STATE.allSlots;
  if(STATE.selectedTime!=='all')filtered=filtered.filter(s=>s.time===STATE.selectedTime);
  if(STATE.selectedPlat!=='all')filtered=filtered.filter(s=>s.platform===STATE.selectedPlat);

  // Build HTML
  let html='<div class="date-title">📆 '+STATE.currentDate+'</div>';

  // Time pills
  html+='<div class="time-strip"><button class="time-pill '+(STATE.selectedTime==='all'?'active':'')+'" data-t="all">🕐 全部时段</button>';
  times.forEach(t=>{
    const tl=t.slice(0,2)+':'+t.slice(2);
    const cnt=STATE.allSlots.filter(s=>s.time===t).length;
    html+='<button class="time-pill '+(t===STATE.selectedTime?'active':'')+'" data-t="'+t+'">'+tl+' <span class="t-count">'+cnt+'</span></button>';
  });
  html+='</div>';

  // Platform pills
  html+='<div class="plat-strip"><button class="plat-pill '+(STATE.selectedPlat==='all'?'active':'')+'" data-p="all">📋 全部</button>';
  plats.forEach(p=>{
    html+='<button class="plat-pill '+(p===STATE.selectedPlat?'active':'')+'" data-p="'+p+'">'+(NAMES[p]||p)+'</button>';
  });
  html+='</div>';

  // Content
  if(filtered.length===0){
    html+='<div class="empty-state">该时段/平台暂无数据</div>';
  } else {
    let total=0;
    for(const slot of filtered)total+=slot.items.length;
    html+='<div style="font-size:12px;color:#9ca3af;margin-bottom:6px">共 '+total+' 条热搜</div><div class="items">';
    for(const slot of filtered){
      for(const item of slot.items){
        const v=parseInt(item.hot_value)||0;
        const cls=v>=1000000?'fire':v>=500000?'warm':'norm';
        const rc=item.rank<=3?'r'+item.rank:'';
        const lbl=v>=1000000?'🔥':v>=500000?'🟠':'';
        html+='<div class="item"><span class="rank '+rc+'">'+item.rank+'</span><span class="plat-tag '+PLAT_CLS[slot.platform]+'">'+(NAMES[slot.platform]||slot.platform)+'</span><span class="title">'+(item.link?'<a href="'+item.link+'" target="_blank">'+esc(item.title)+'</a>':esc(item.title))+'</span><span class="tag '+cls+'">'+lbl+fmt(v)+'</span></div>';
      }
    }
    html+='</div>';
  }
  area.innerHTML=html;

  // Bind events
  document.querySelectorAll('.time-pill').forEach(el=>el.addEventListener('click',()=>{STATE.selectedTime=el.dataset.t;renderContent()}));
  document.querySelectorAll('.plat-pill').forEach(el=>el.addEventListener('click',()=>{STATE.selectedPlat=el.dataset.p;renderContent()}));
}

async function renderSearch(area,q){
  area.innerHTML='<div class="date-title">🔍 "'+esc(q)+'"</div><div class="loading"><span class="sp"></span> 搜索中...</div>';
  const res=[];
  for(const [ds,dd] of Object.entries(STATE.dates)){
    for(const [p,times] of Object.entries(dd.platforms||{})){
      for(const t of times){
        try{
          const data=await loadJSON('./data/'+p+'/'+ds+'/'+t+'.json');
          if(!data||!data.items)continue;
          for(const item of data.items){
            if(item.title.includes(q))res.push({date:ds,platform:p,time:t,...item});
          }
        }catch(e){}
      }
    }
  }
  res.sort((a,b)=>a.date!=b.date?a.date.localeCompare(b.date):a.time.localeCompare(b.time));
  if(res.length===0){area.innerHTML='<div class="date-title">🔍 "'+esc(q)+'"</div><div class="empty-state">未找到相关结果</div>';return}
  area.innerHTML='<div class="date-title">🔍 "'+esc(q)+'"</div><div class="search-result">共 '+res.length+' 条</div>';
  let html='',last='';
  for(const item of res){
    if(item.date!==last){if(last)html+='</div></div>';html+='<div class="items" style="margin-top:8px"><div style="font-size:12px;font-weight:600;color:#6b7280;padding:4px 0">📅 '+item.date+'</div>';last=item.date}
    const v=parseInt(item.hot_value)||0;
    const cls=v>=1000000?'fire':v>=500000?'warm':'norm';
    const rc=item.rank<=3?'r'+item.rank:'';
    html+='<div class="item"><span class="rank '+rc+'">'+item.rank+'</span><span class="plat-tag '+PLAT_CLS[item.platform]+'">'+(NAMES[item.platform]||item.platform)+'</span><span class="title">'+(item.link?'<a href="'+item.link+'" target="_blank">'+esc(item.title)+'</a>':esc(item.title))+'</span><span class="tag '+cls+'">'+fmt(v)+'</span></div>';
  }
  html+='</div>';
  area.innerHTML='<div class="date-title">🔍 "'+esc(q)+'"</div><div class="search-result">共 '+res.length+' 条</div>'+html;
}

function fmt(v){if(v>=100000000)return (v/100000000).toFixed(1)+'亿';if(v>=10000)return (v/10000).toFixed(v>=100000?0:1)+'万';return v}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
